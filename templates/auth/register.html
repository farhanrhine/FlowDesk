{% extends "base.html" %}

{% block title %}Join FlowDesk{% endblock %}

{% block content %}
<div style="max-width: var(--auth-width); margin: 4rem auto;">
    <div class="card card-shadow">
        <h2 class="mb-4" style="text-align: center;">Get Started</h2>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="johndoe">
                <small class="text-muted" style="font-size: 0.75rem;">3-80 chars, letters/numbers/underscores.</small>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Min. 8 characters">
            </div>
            <button type="submit" class="btn btn-submit mt-4">Create Account</button>
        </form>
        <div class="mt-4" style="text-align: center; font-size: 0.9rem; color: var(--ink-muted);">
            Already using FlowDesk? <a href="{{ url_for('auth.login') }}">Log in here</a>
        </div>
    </div>
</div>
{% endblock %}
