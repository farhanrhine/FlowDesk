{% extends "base.html" %}

{% block title %}Login - FlowDesk{% endblock %}

{% block content %}
<div style="max-width: var(--auth-width); margin: 4rem auto;">
    <div class="card card-shadow">
        <h2 class="mb-4" style="text-align: center;">Welcome Back</h2>
        <form method="POST">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" required placeholder="Enter your credentials">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-top: -0.5rem;">
                <input type="checkbox" id="remember" name="remember" style="width: auto;">
                <label for="remember" style="margin-bottom: 0; cursor: pointer;">Remember Me</label>
            </div>
            <button type="submit" class="btn btn-submit mt-4">Sign In</button>
        </form>
        <div class="mt-4" style="text-align: center; font-size: 0.9rem; color: var(--ink-muted);">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Create one here</a>
        </div>
    </div>
</div>
{% endblock %}
