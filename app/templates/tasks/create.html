{% extends "base.html" %}

{% block title %}Create Task - {{ project.name }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="{{ url_for('projects.list_projects') }}">Projects</a></li>
    <li class="breadcrumb-item"><a href="{{ url_for('projects.detail', id=project.id) }}">{{ project.name }}</a></li>
    <li class="breadcrumb-item active" aria-current="page">Create Task</li>
  </ol>
</nav>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">Create New Task for {{ project.name }}</div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Task Title</label>
                        <input type="text" class="form-control" id="title" name="title" required minlength="3" maxlength="200">
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description (Optional)</label>
                        <textarea class="form-control" id="description" name="description" rows="4"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="priority" class="form-label">Priority</label>
                            <select name="priority" id="priority" class="form-select">
                                <option value="low">Low</option>
                                <option value="medium" selected>Medium</option>
                                <option value="high">High</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="due_date" class="form-label">Due Date (Optional)</label>
                            <input type="date" class="form-control" id="due_date" name="due_date">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="assigned_to" class="form-label">Assigned To (Optional)</label>
                        <select name="assigned_to" id="assigned_to" class="form-select">
                            <option value="">Unassigned</option>
                            {% for member in project.members %}
                                <option value="{{ member.user.id }}">{{ member.user.username }} ({{ member.role }})</option>
                            {% endfor %}
                        </select>
                        <div class="form-text">Admins can assign to anyone. Members can only assign to themselves.</div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('projects.detail', id=project.id) }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Task</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
